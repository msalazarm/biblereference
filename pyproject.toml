[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biblereference"
version = "0.1.0"
description = "Markdown preprocessor that expands scripture citation tags into verified verse text, with Hebrew, Septuagint, and Greek originals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marco" }]
keywords = ["bible", "markdown", "septuagint", "vulgate", "versification", "theology"]

dependencies = [
    "pythonbible>=0.13",
    "lxml>=5.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "httpx>=0.27",
    "regex>=2024.0",
]

[project.optional-dependencies]
web = ["beautifulsoup4>=4.12"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
biblereference = "biblereference.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biblereference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # ambiguous-unicode: we deal in Greek and Hebrew
    "SIM905",  # book lists read far better as one split string than 90 lines of quotes
]

[tool.mypy]
python_version = "3.11"
packages = ["biblereference"]
mypy_path = "src"
strict = true
warn_return_any = true
